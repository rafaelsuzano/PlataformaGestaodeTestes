spring:
  application:
    name: SuzanoIT-QA
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:suzanoit_qa}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        tenant_identifier_resolver: br.com.suzanoit.qa.modules.tenant.infrastructure.CurrentTenantIdentifierResolverImpl
  flyway:
    enabled: true
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:suzanoit_qa}
    user: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}

server:
  port: 8080
